<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Publication and recovery</title><desc id="desc">Validate facts, write immutable shards, switch the pointer, update SQLite, then acknowledge the exact work version. Failed work is retained for recovery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397b80"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#284a4c}.en{font-size:18px;font-weight:650}.zh{font-size:15px;fill:#4a6564}.small{font-size:13px;fill:#4a6564}.edge{fill:none;stroke:#397b80;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0faf7;stroke:#8ac6be;stroke-width:1.5}.warm{fill:#fff3df;stroke:#dfbf87}</style><rect width="1000" height="400" rx="22" fill="#fffdf7"/><rect class="box " x="25" y="40" width="280" height="100" rx="14"/><text class="en" x="165.0" y="87.0" text-anchor="middle">1. Validate facts</text><text class="zh" x="165.0" y="113.0" text-anchor="middle">验证来源与用量</text><rect class="box " x="360" y="40" width="280" height="100" rx="14"/><text class="en" x="500.0" y="87.0" text-anchor="middle">2. Write shards</text><text class="zh" x="500.0" y="113.0" text-anchor="middle">写完不可变内容</text><rect class="box " x="695" y="40" width="280" height="100" rx="14"/><text class="en" x="835.0" y="87.0" text-anchor="middle">3. Switch pointer</text><text class="zh" x="835.0" y="113.0" text-anchor="middle">原子切换当前版本</text><rect class="box " x="695" y="210" width="280" height="100" rx="14"/><text class="en" x="835.0" y="257.0" text-anchor="middle">4. Project in SQLite</text><text class="zh" x="835.0" y="283.0" text-anchor="middle">事务更新查询投影</text><rect class="box " x="360" y="210" width="280" height="100" rx="14"/><text class="en" x="500.0" y="257.0" text-anchor="middle">5. Acknowledge</text><text class="zh" x="500.0" y="283.0" text-anchor="middle">按领取版本确认工作</text><rect class="box warm" x="25" y="210" width="280" height="100" rx="14"/><text class="en" x="165.0" y="257.0" text-anchor="middle">Retry pending work</text><text class="zh" x="165.0" y="283.0" text-anchor="middle">失败保留工作并恢复</text><path class="edge" d="M 305 90 L 360 90"/><path class="edge" d="M 640 90 L 695 90"/><path class="edge" d="M 835 140 L 835 210"/><path class="edge" d="M 695 260 L 640 260"/><path class="edge" stroke-dasharray="6 5" d="M 695 300 L 675 335 L 165 335 L 165 310"/><path class="edge" stroke-dasharray="6 5" d="M 165 210 L 165 140"/><text class="small" x="30" y="372">Ordered publication + idempotent recovery · 有序发布与幂等恢复，不是文件与数据库共享一个事务</text></svg>