<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Session, Atom, Task and Attempt</title><desc id="desc">One Session contains Atoms; multiple Atoms can support a Task; each Task can have several Attempts. Attempts reference evidence ranges.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397b80"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#284a4c}.en{font-size:18px;font-weight:650}.zh{font-size:15px;fill:#4a6564}.small{font-size:13px;fill:#4a6564}.edge{fill:none;stroke:#397b80;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0faf7;stroke:#8ac6be;stroke-width:1.5}.warm{fill:#fff3df;stroke:#dfbf87}</style><rect width="1000" height="380" rx="22" fill="#fffdf7"/><rect class="box " x="25" y="115" width="155" height="94" rx="14"/><text class="en" x="102.5" y="159.0" text-anchor="middle">Session</text><text class="zh" x="102.5" y="185.0" text-anchor="middle">会话证据</text><rect class="box " x="245" y="30" width="165" height="76" rx="14"/><text class="en" x="327.5" y="65.0" text-anchor="middle">Atom A1</text><text class="zh" x="327.5" y="91.0" text-anchor="middle">连续片段</text><path class="edge" d="M 180 162 L 210 162 L 210 68 L 245 68"/><rect class="box " x="245" y="140" width="165" height="76" rx="14"/><text class="en" x="327.5" y="175.0" text-anchor="middle">Atom A2</text><text class="zh" x="327.5" y="201.0" text-anchor="middle">连续片段</text><path class="edge" d="M 180 162 L 210 162 L 210 178 L 245 178"/><rect class="box " x="245" y="250" width="165" height="76" rx="14"/><text class="en" x="327.5" y="285.0" text-anchor="middle">Atom A3</text><text class="zh" x="327.5" y="311.0" text-anchor="middle">连续片段</text><path class="edge" d="M 180 162 L 210 162 L 210 288 L 245 288"/><rect class="box " x="490" y="80" width="165" height="90" rx="14"/><text class="en" x="572.5" y="122.0" text-anchor="middle">Task T1</text><text class="zh" x="572.5" y="148.0" text-anchor="middle">用户目标</text><rect class="box " x="490" y="250" width="165" height="76" rx="14"/><text class="en" x="572.5" y="285.0" text-anchor="middle">Task T2</text><text class="zh" x="572.5" y="311.0" text-anchor="middle">独立目标</text><path class="edge" d="M 410 68 L 452 68 L 452 108 L 490 108"/><path class="edge" d="M 410 178 L 452 178 L 452 145 L 490 145"/><path class="edge" d="M 410 288 L 490 288"/><rect class="box warm" x="735" y="30" width="235" height="76" rx="14"/><text class="en" x="852.5" y="65.0" text-anchor="middle">Attempt P1</text><text class="zh" x="852.5" y="91.0" text-anchor="middle">首次执行</text><rect class="box warm" x="735" y="140" width="235" height="76" rx="14"/><text class="en" x="852.5" y="175.0" text-anchor="middle">Attempt P2</text><text class="zh" x="852.5" y="201.0" text-anchor="middle">纠正或重试</text><rect class="box warm" x="735" y="250" width="235" height="76" rx="14"/><text class="en" x="852.5" y="285.0" text-anchor="middle">Attempt Q1</text><text class="zh" x="852.5" y="311.0" text-anchor="middle">独立执行</text><path class="edge" d="M 655 108 L 693 108 L 693 68 L 735 68"/><path class="edge" d="M 655 145 L 693 145 L 693 178 L 735 178"/><path class="edge" d="M 655 288 L 735 288"/><text class="small" x="30" y="360">Relationships, not a one-to-one pipeline · 关联关系，不是一对一流水线；Attempt 通过证据范围引用原始片段</text></svg>