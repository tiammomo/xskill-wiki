<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">Evidence processing flow</title><desc id="desc">Normalize sources, segment and validate Atoms, collect scoped evidence, link goals, group attempts, and publish a versioned graph.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#397b80"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#284a4c}.en{font-size:18px;font-weight:650}.zh{font-size:15px;fill:#4a6564}.small{font-size:13px;fill:#4a6564}.edge{fill:none;stroke:#397b80;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f0faf7;stroke:#8ac6be;stroke-width:1.5}.warm{fill:#fff3df;stroke:#dfbf87}</style><rect width="1000" height="380" rx="22" fill="#fffdf7"/><rect class="box " x="25" y="32" width="280" height="104" rx="14"/><text class="en" x="165.0" y="81.0" text-anchor="middle">1. Normalize</text><text class="zh" x="165.0" y="107.0" text-anchor="middle">规范化来源</text><rect class="box " x="360" y="32" width="280" height="104" rx="14"/><text class="en" x="500.0" y="81.0" text-anchor="middle">2. Segment</text><text class="zh" x="500.0" y="107.0" text-anchor="middle">拆分并校验 Atom</text><rect class="box " x="695" y="32" width="280" height="104" rx="14"/><text class="en" x="835.0" y="81.0" text-anchor="middle">3. Scope evidence</text><text class="zh" x="835.0" y="107.0" text-anchor="middle">收集带范围的证据</text><rect class="box " x="695" y="212" width="280" height="104" rx="14"/><text class="en" x="835.0" y="261.0" text-anchor="middle">4. Link goals</text><text class="zh" x="835.0" y="287.0" text-anchor="middle">有界候选与 Task 关联</text><rect class="box " x="360" y="212" width="280" height="104" rx="14"/><text class="en" x="500.0" y="261.0" text-anchor="middle">5. Group attempts</text><text class="zh" x="500.0" y="287.0" text-anchor="middle">连续、重试与纠正</text><rect class="box " x="25" y="212" width="280" height="104" rx="14"/><text class="en" x="165.0" y="261.0" text-anchor="middle">6. Publish graph</text><text class="zh" x="165.0" y="287.0" text-anchor="middle">结果、归因与版本发布</text><path class="edge" d="M 305 84 L 360 84"/><path class="edge" d="M 640 84 L 695 84"/><path class="edge" d="M 835 136 L 835 212"/><path class="edge" d="M 695 264 L 640 264"/><path class="edge" d="M 360 264 L 305 264"/><text class="small" x="30" y="360">Identity + source revision throughout · 全程携带身份与来源版本；证据不足时保留未知与待确认关系</text></svg>